<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction 4 — Corners</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:#000;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* four corners: the whole navigation */
.c{position:fixed;padding:22px 26px;font-size:14px;letter-spacing:.02em;z-index:2}
.c a:hover{text-decoration:underline;text-underline-offset:4px}
.tl{top:0;left:0}.tr{top:0;right:0;text-align:right}.bl{bottom:0;left:0}.br{bottom:0;right:0;text-align:right}
.c.tr a,.c.bl a,.c.br a{display:block}
.tl b{font-weight:400}
/* the picture */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px}
.stage img{max-width:min(760px,84vw);max-height:66vh;width:auto;height:auto;filter:grayscale(1);display:block}
.stage p{margin:22px 0 0;text-align:center;max-width:46em;font-size:15px;color:#222}
.stage p a{border-bottom:1px solid #000}
.stage .cap{margin-top:10px;font-size:11px;color:#999;letter-spacing:.04em}
.badge{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font:12px system-ui;padding:6px 10px;letter-spacing:.08em}
@media(max-width:640px){.c{padding:14px 16px;font-size:13px}.stage{padding:110px 20px 120px}.stage img{max-width:88vw;max-height:none}}
</style></head><body>
<div class="c tl"><a><b>Sangeeta Singh-Kurtz</b></a></div>
<div class="c tr"><a>Work</a><a>Speaking</a></div>
<div class="c bl"><a>Projects</a><a>Contact</a></div>
<div class="c br"><a>Instagram</a><a>LinkedIn</a></div>

<main class="stage">
  <img src="/images/about.webp" alt="">
  <p>A freelance journalist who investigates intriguing people. Formerly a staff writer at <a>New York Magazine</a>. Lives in Tokyo, where she recently completed her debut novel.</p>
  <div class="cap">Photograph by Nicholas Takahashi</div>
</main>
<div class="badge">4 · CORNERS</div>
</body></html>
