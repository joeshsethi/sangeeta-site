# Pages CMS configuration — https://pagescms.org/docs/configuration
# This defines the editing screens at https://app.pagescms.org
# Every field here maps to a real part of the live site.

media:
  input: public/images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif, svg]

content:
  - name: about
    label: Home page
    type: file
    path: content/about.json
    fields:
      - name: photo
        label: Main photo
        type: image
        required: true
        description: "The large photo at the top. Landscape or portrait both work."
      - name: photoCreditName
        label: Photo credit — photographer's name
        type: string
      - name: photoCreditUrl
        label: Photo credit — link to their site
        type: string
        pattern:
          regex: "^https?://.+"
          message: "Must be a full web address starting with https://"
      - name: bio
        label: Bio
        type: text
        list: true
        description: "One box per paragraph. For a link write [the words](https://the-address). For italics put *asterisks* around the words."
      - name: selected
        label: "\"Work\" list on the home page"
        type: object
        list: true
        description: "The short list of highlights. The full list lives on the Work page."
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
            pattern:
              regex: "^https?://.+"
              message: "Must be a full web address starting with https://"
          - name: pub
            label: Publication
            type: string

  - name: work
    label: Work page
    type: file
    path: content/work.json
    fields:
      - name: sections
        label: Sections
        type: object
        list: true
        description: "Each section has a heading and its own list of articles."
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: items
            label: Articles
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: blurb
                label: One-line description
                type: text
                description: "Put *asterisks* around words for italics."
              - name: url
                label: Link
                type: string
                required: true
                pattern:
                  regex: "^https?://.+"
                  message: "Must be a full web address starting with https://"
              - name: pub
                label: Publication (not shown on the Work page)
                type: string
      - name: clips
        label: Magazine clippings
        type: image
        list: true
        description: "The row of images at the bottom of the Work page."

  - name: speaking
    label: "\"Talks & Media\" (home page)"
    type: file
    path: content/speaking.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Talks & appearances
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: pub
            label: Outlet or show
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
            pattern:
              regex: "^https?://.+"
              message: "Must be a full web address starting with https://"

  - name: projects
    label: "\"Projects, Podcasts, & Newsletters\" (home page)"
    type: file
    path: content/projects.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: pub
            label: Outlet or platform
            type: string
          - name: url
            label: Link
            type: string
            required: true
            pattern:
              regex: "^https?://.+"
              message: "Must be a full web address starting with https://"
          - name: blurb
            label: Description (not shown on the home page)
            type: text

  - name: site
    label: Settings
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
        description: "Only used in the browser tab title."
      - name: instagram
        label: Instagram address
        type: string
      - name: linkedin
        label: LinkedIn address
        type: string
      - name: contactEmail
        label: Contact email
        type: string
      - name: formEndpoint
        label: Contact form address (Formspree)
        type: string
        description: "Leave as is unless the contact form is being moved somewhere else."
