<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction 9 — Frame</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:#000;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* one page per corner */
.c{position:fixed;padding:22px 26px;font-size:14px;letter-spacing:.02em;z-index:2}
.c a:hover{text-decoration:underline;text-underline-offset:4px}
.tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}
/* socials, bottom centre */
.soc{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:18px;z-index:2}
.soc a{display:block;width:18px;height:18px;opacity:.85}
.soc a:hover{opacity:1}
.soc svg{width:100%;height:100%;display:block;fill:#000}
/* the picture, with the name on it */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px 90px}
.pic{position:relative;display:inline-block}
.pic img{max-width:min(880px,86vw);max-height:70vh;width:auto;height:auto;filter:grayscale(1) brightness(.94);display:block}
.pic h1{position:absolute;left:0;right:0;bottom:7%;margin:0;text-align:center;color:#fff;font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(40px,6.4vw,92px);line-height:1;letter-spacing:-.01em}
.stage p{margin:14px 0 0;text-align:center;max-width:44em;font-size:15px;color:#222}
.stage p a{border-bottom:1px solid #000}
.stage .cap{margin-top:12px;font-size:11px;color:#999;letter-spacing:.04em}
.badge{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000;color:#fff;font:12px system-ui;padding:6px 10px;letter-spacing:.08em}
@media(max-width:640px){.c{padding:14px 16px;font-size:13px}.stage{padding:64px 16px 96px}.pic img{max-width:92vw;max-height:none}.pic h1{font-size:clamp(28px,9vw,40px)}}
</style></head><body>
<div class="c tl"><a>Work</a></div>
<div class="c tr"><a>Speaking</a></div>
<div class="c bl"><a>Projects</a></div>
<div class="c br"><a>Contact</a></div>

<main class="stage">

    <img src="/images/about.webp" alt="">

  <p>A freelance journalist who investigates intriguing people. Formerly a staff writer at <a>New York Magazine</a>. Lives in Tokyo, where she recently completed her debut novel.</p>
